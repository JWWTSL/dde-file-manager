- id: case_1805909
  name: 添加数据到回收站-添加同一属组不同用户的文件/文件夹到回收站
  module: /V25_2500（测试部专用）/A类核心模块/文件管理器/主界面区域/固定目录/回收站(#110837)
  status: non_gui
  steps:
  - step_type: action
    description: 1. 新建文件/文件夹A，如在桌面新建
    needs_accessible_name: false
  - step_type: action
    description: '2. 更改文件/文件夹A所属用户，命令行输入:'
    needs_accessible_name: false
  - step_type: action
    description: chown 其他用户名  文件/文件夹A（前提是已切换到桌面路径下：cd ~/Desktop）
    needs_accessible_name: false
  - step_type: action
    description: 3. 更改文件权限：chmod 777 文件/文件夹A
    needs_accessible_name: false
  - step_type: action
    description: 4. 右键删除文件/文件夹A到回收站
    needs_accessible_name: false
  - step_type: assert
    description: 1. 新建成功
    needs_accessible_name: false
  - step_type: assert
    description: 2. 文件所属用户更改成功
    needs_accessible_name: false
  - step_type: assert
    description: 3. 权限更改成功（若不更改权限，则直接不能删除文件到回收站）
    needs_accessible_name: false
  - step_type: assert
    description: 4. 删除成功，回收站内正常显示该文件/文件夹
    needs_accessible_name: false
