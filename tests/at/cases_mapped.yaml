  module: 办公云盘插件
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: ToggleModeBtn
    do: click
    wait: 1.0
  - action: dtk_context_menu
    selector:
      name: 主目录
    items:
    - 视图模式
    - 图标模式
    wait: 1.0
  - action: keyboard_press
    key: Menu
    wait: 1.0
  - action: element_action
    ref: 显示预览
    do: click
    wait: 1.0
  - action: keyboard_press
    key: Menu
    wait: 1.0
  - action: element_action
    ref: 显示预览
    do: click
    wait: 1.0
