    key: Menu
    wait: 1.0
  - action: element_action
    ref: 显示预览
    do: click
    wait: 1.0
  - action: keyboard_press
    key: Menu
    wait: 1.0
  - action: element_action
    ref: 显示预览
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
