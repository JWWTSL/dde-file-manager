  - P0-2
  - weak
  vars:
    xlsx_id: '1973563'
  steps:
  - action: session_start
    command: bash -lc 'set -e; d=/tmp/dde-at-fixtures/case_1973563; rm -rf "$d"; mkdir -p "$d/black-path"; printf "black-path\n" > "$d/black-path/black-path.txt"; printf "updated\n" > "$d/black-path/black-path.txt"; touch "$d/PASS_1973563"; pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager "$d" >/tmp/dfm_at_1973563.log 2>&1 & sleep 3; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1000 650'
