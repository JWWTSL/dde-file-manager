  description: 'xlsx 用例编号: 1805257；构造隐藏文件并切换显示隐藏文件配置，弱覆盖隐藏文件搜索入口。'
  tags:
  - P0-2
  - weak
  vars:
    xlsx_id: '1805257'
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; d=/tmp/dde-at-fixtures/case_1805257; cfg="$HOME/.config/deepin/dde-file-manager.json"; backup=/tmp/dfm_at_1805257_config_backup.json; rm -rf "$d"; mkdir -p "$d"; printf "hidden-search-probe\n" > "$d/.hidden-search-probe.txt"; cp "$cfg" "$backup" 2>/dev/null || printf "{}\n" > "$backup"; python3 - <<"PY"
      import json
      from pathlib import Path
      cfg = Path.home() / ".config/deepin/dde-file-manager.json"
      cfg.parent.mkdir(parents=True, exist_ok=True)
      data = json.loads(cfg.read_text(encoding="utf-8")) if cfg.exists() else {}
      data.setdefault("GenericAttribute", {})["ShowedHiddenFiles"] = True
      cfg.write_text(json.dumps(data, ensure_ascii=False, indent=4) + "\n", encoding="utf-8")
      PY
      touch "$d/PASS_1805257"; pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager "$d" >/tmp/dfm_at_1805257.log 2>&1 & sleep 3; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1000 650'
