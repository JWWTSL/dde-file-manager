name: xlsx严格预览补全_suite
app: dde-file-manager
description: 使用 dconfig 命令和 AT 树详情区域断言补全预览开关类缺口，仅保留本地运行通过的用例
module: xlsx严格预览补全
tags:
- strict
fast_fail: false
env_check: []
setup: []
suites: []
teardown:
- action: session_start
  command: >-
    bash -lc 'base=/tmp/dde-at-fixtures/case_1807263; if [ -f "$base/original_preview" ]; then old=$(cat "$base/original_preview"); dde-dconfig set -a org.deepin.dde.file-manager -r org.deepin.dde.file-manager.view -k dfm.displaypreview.visible -v "$old"; fi; pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; rm -rf "$base"'
  wait: 0.2
