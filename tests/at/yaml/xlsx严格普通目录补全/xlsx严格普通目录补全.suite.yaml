name: xlsx严格普通目录补全_suite
app: dde-file-manager
description: 从 V25 xlsx 主界面区域/固定目录/普通目录与文件操作其他批次中筛选的严格普通目录文件系统结果用例，使用 /tmp/dde-at-fixtures 隔离夹具并断言实际文件和目录结果
module: xlsx严格普通目录补全
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'rm -rf /tmp/dde-at-fixtures/strict-normal-dir && mkdir -p /tmp/dde-at-fixtures/strict-normal-dir'
  wait: 1.0
suites: []
teardown:
- action: session_start
  command: bash -lc 'rm -rf /tmp/dde-at-fixtures/strict-normal-dir'
  wait: 0.3
- action: session_stop
