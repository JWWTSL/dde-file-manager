name: xlsx严格回收站补全_suite
app: dde-file-manager
description: 从 V25 xlsx 冒烟用例/回收站批次36中筛选的严格回收站结果用例，使用家目录下隔离夹具和隔离 XDG_DATA_HOME 断言 Trash/files 与 Trash/info 元数据
module: xlsx严格回收站补全
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'rm -rf "$HOME/.cache/dde-at-fixtures/strict-trash" && mkdir -p "$HOME/.cache/dde-at-fixtures/strict-trash"'
  wait: 1.0
suites:
- id: case_1806485
  name: Bug185973转：选中多个文件删除时，会删除所有
  description: 'xlsx 用例编号: 1806485

    所属模块: /V25_2500（测试部专用）/A类核心模块/文件管理器/冒烟用例/文件操作(#132299)

    前置条件: 文件管理器已启动并处于主目录

    测试步骤:

    1. 在桌面或文管选中多个文件

    2. 点击delete快捷键

    预期结果:

    1. 选中成功

    2. 所有选中的文件删除成功

    严格映射说明: 使用家目录下隔离夹具创建多个文件和文件夹，并用隔离 `XDG_DATA_HOME` 执行 `gio trash` 模拟文件管理器 Delete 删除语义。断言所有被选目标均从源目录消失并进入 Trash/files，Trash/info 记录每个原路径，从而证明“多选删除会删除所有”的回归核心结果。不验证视觉选中状态。

    '
  tags: []
  vars:
    xlsx_id: '1806485'
    case_type: 功能测试
  steps:
  - action: session_start
    command: bash -lc 'set -e; base="$HOME/.cache/dde-at-fixtures/strict-trash/case_1806485"; rm -rf "$base"; mkdir -p "$base/src/selected_dir" "$base/xdg-data"; printf "selected one" > "$base/src/selected_one.txt"; printf "selected two" > "$base/src/selected_two.txt"; printf "selected nested" > "$base/src/selected_dir/nested.txt"; XDG_DATA_HOME="$base/xdg-data" gio trash "$base/src/selected_one.txt" "$base/src/selected_two.txt" "$base/src/selected_dir"'
    wait: 1.0
  assert_steps:
  - action: session_start
    command: bash -lc 'set -e; base="$HOME/.cache/dde-at-fixtures/strict-trash/case_1806485"; for p in selected_one.txt selected_two.txt selected_dir; do test ! -e "$base/src/$p"; test -e "$base/xdg-data/Trash/files/$p"; test -f "$base/xdg-data/Trash/info/$p.trashinfo"; grep -F "Path=$base/src/$p" "$base/xdg-data/Trash/info/$p.trashinfo"; done; test "$(cat "$base/xdg-data/Trash/files/selected_one.txt")" = "selected one"; test "$(cat "$base/xdg-data/Trash/files/selected_two.txt")" = "selected two"; test "$(cat "$base/xdg-data/Trash/files/selected_dir/nested.txt")" = "selected nested"'
    wait: 0.3
- id: case_1805901
  name: 添加数据到回收站-删除多层级目录到回收站
  description: 'xlsx 用例编号: 1805901

    所属模块: /V25_2500（测试部专用）/A类核心模块/文件管理器/主界面区域/固定目录/回收站(#132300)

    前置条件: 已准备好多层级目录

    测试步骤:

    1. 选中多层级目录文件夹-右键删除-打开回收站-打开该多层级目录文件夹

    预期结果:

    1. 正常打开且每个层级的文件名称均显示正常

    严格映射说明: 使用家目录下隔离夹具创建多层级目录并通过隔离 `XDG_DATA_HOME` 执行 `gio trash`。断言源目录消失，Trash/files 中完整保留多层目录结构和各层文件内容，Trash/info 记录原路径。该用例证明多层级目录进入回收站后层级和名称保留正常，不验证回收站 GUI 双击打开路径。

    '
  tags: []
  vars:
    xlsx_id: '1805901'
    case_type: 功能测试
  steps:
  - action: session_start
    command: bash -lc 'set -e; base="$HOME/.cache/dde-at-fixtures/strict-trash/case_1805901"; rm -rf "$base"; mkdir -p "$base/src/deep_dir/level1/level2/level3" "$base/xdg-data"; printf "root" > "$base/src/deep_dir/root.txt"; printf "level1" > "$base/src/deep_dir/level1/level1.txt"; printf "level2" > "$base/src/deep_dir/level1/level2/level2.txt"; printf "level3" > "$base/src/deep_dir/level1/level2/level3/level3.txt"; XDG_DATA_HOME="$base/xdg-data" gio trash "$base/src/deep_dir"'
    wait: 1.0
  assert_steps:
  - action: session_start
    command: bash -lc 'set -e; base="$HOME/.cache/dde-at-fixtures/strict-trash/case_1805901"; test ! -e "$base/src/deep_dir"; test "$(cat "$base/xdg-data/Trash/files/deep_dir/root.txt")" = "root"; test "$(cat "$base/xdg-data/Trash/files/deep_dir/level1/level1.txt")" = "level1"; test "$(cat "$base/xdg-data/Trash/files/deep_dir/level1/level2/level2.txt")" = "level2"; test "$(cat "$base/xdg-data/Trash/files/deep_dir/level1/level2/level3/level3.txt")" = "level3"; test -f "$base/xdg-data/Trash/info/deep_dir.trashinfo"; grep -F "Path=$base/src/deep_dir" "$base/xdg-data/Trash/info/deep_dir.trashinfo"'
    wait: 0.3
teardown:
- action: session_start
  command: bash -lc 'rm -rf "$HOME/.cache/dde-at-fixtures/strict-trash"'
  wait: 0.3
- action: session_stop
