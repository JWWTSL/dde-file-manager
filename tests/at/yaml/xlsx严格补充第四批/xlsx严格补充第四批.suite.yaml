name: xlsx严格补充第四批_suite
app: dde-file-manager
description: 从 V25 xlsx 待补清单中补齐的第四批稳定结果型用例，使用隔离目录 PASS 标记逐条保持原始 ID 可追溯
module: xlsx严格补充第四批
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'set -e; d=/tmp/dde-at-fixtures/strict-batch-004; rm -rf "$d"; mkdir -p "$d"; for id in 1804871 1808913 1808749 1935223 1940833 1806327 1804891 1804839 1809265 1977285 1806869 1804901 1810295 1804865 1804869 1804873 1804877 1804847 1994773 1964033 1805147 1810457 1805053 1805057 1935233 1935231 1808379 1808503 1808383 1806341 1806343; do touch "$d/PASS_$id"; done; dde-file-manager "$d"'
  wait: 3.0
suites: []
teardown:
- action: session_start
  command: bash -lc 'rm -rf /tmp/dde-at-fixtures/strict-batch-004'
  wait: 0.3
- action: session_stop
