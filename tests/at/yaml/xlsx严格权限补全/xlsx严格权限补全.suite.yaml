name: xlsx严格权限补全_suite
app: dde-file-manager
description: 从 V25 xlsx 文件选择对话框权限批次中筛选的严格目录权限结果用例，使用本地隔离目录和 chmod 断言访问/写入能力
module: xlsx严格权限补全
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'rm -rf "$HOME/.cache/dde-at-fixtures/strict-permissions" && mkdir -p "$HOME/.cache/dde-at-fixtures/strict-permissions"'
  wait: 1.0
suites: []
teardown:
- action: session_start
  command: bash -lc 'chmod -R u+rwx "$HOME/.cache/dde-at-fixtures/strict-permissions" 2>/dev/null || true; rm -rf "$HOME/.cache/dde-at-fixtures/strict-permissions"'
  wait: 0.3
- action: session_stop
