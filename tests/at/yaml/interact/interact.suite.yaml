name: 交互场景_suite
app: dde-file-manager
description: 交互场景模块 AT-SPI 用例
module: 交互场景
tags: []
fast_fail: false
env_check: []
setup: []
suites:
- id: case_interact_交互场景_002
  name: 打乱快捷键摁下顺序仍可正常使用快捷键功能
  description: '来源用例编号: 1968781'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: keyboard_press
    key: ctrl+s
    wait: 1.0
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
  - action: assert_process_running
    app: dde-file-manager
- id: case_interact_交互场景_017
  name: 【Bug转用例场景】选中多个文件删除时，会删除所有
  description: '来源用例编号: 1810625'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 桌面
    do: click
    wait: 1.0
  - action: keyboard_press
    key: Delete
    wait: 1.0
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
  - action: assert_process_running
    app: dde-file-manager
- id: case_interact_交互场景_018
  name: 【Bug转用例场景】在文管重命名目录后马上删除目录
  description: '来源用例编号: 1810621'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: keyboard_press
    key: Menu
    wait: 1.0
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
- id: case_interact_交互场景_020
  name: 【文件管理器】其他应用打开文件夹时对文件进行删除操作，并且Ctrl+Z进行撤回，文件被还原
  description: '来源用例编号: 1810613'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: keyboard_press
    key: ctrl+z
    wait: 1.0
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
- id: case_interact_交互场景_021
  name: 桌面快速右键不同文件，不会触发打开操作_
  description: '来源用例编号: 1810611'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 桌面
    do: right_click
    wait: 1.0
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
