name: xlsx假覆盖补全批次三_suite
app: dde-file-manager
description: 假覆盖删除后批次三补全，覆盖 P4 宽松弱覆盖缺口
module: xlsx假覆盖补全批次三
tags:
- batch3
- weak
fast_fail: false
env_check: []
setup: []
suites:
- id: case_batch3_permission_operations
  name: 【文件操作】权限操作_批次三补全
  description: 'xlsx 用例编号: 1806765, 1806767, 1806769, 1806771, 1806773, 1806775'
  tags: [P4, weak]
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+l
    wait: 0.5
  - action: keyboard_type
    text: /tmp
    wait: 0.5
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
- id: case_batch3_group_fold
