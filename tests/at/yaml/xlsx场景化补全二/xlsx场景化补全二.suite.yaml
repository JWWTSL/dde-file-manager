name: xlsx场景化补全二_suite
app: dde-file-manager
description: 场景化补全第二批——覆盖复制文件地址、撤销/恢复操作、回收站操作、文件列表分组、文件索引配置、标签页固定等主题，强化真实功能操作与业务结果断言
module: xlsx场景化补全二
tags:
- strict
fast_fail: false
env_check: []
setup: []
suites:
# ── 复制文件地址：本地文件路径复制（8 个原始 ID）──
- id: case_1940085
  name: 【复制文件地址】本地与家目录文件地址复制
  description: 'xlsx 用例编号: 1940085, 1940087, 1940081, 1940211, 1939469, 1940089, 1940107, 1940209'
  tags:
  - P2
  - strict
  vars: {xlsx_id: '1940085'}
  steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1940085; rm -rf "$base"; mkdir -p "$base"; printf data > "$base/test_copy.txt"; printf data > "$base/.hidden_copy.txt"; printf data > "$base/长文件名测试.txt"; rm -f "$base/PASS_1940085"; pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager "$base" >/tmp/dfm_at_1940085.log 2>&1 & sleep 5; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+shift+c
    wait: 1.0
  assert_steps:
  - action: session_start
    command: python3 tests/at/yaml/xlsx场景化补全二/assert_clipboard_contains.py /tmp/dde-at-fixtures/case_1940085/PASS_1940085 test_copy.txt
    wait: 3.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1940085/PASS_1940085
# ── 撤销/恢复：删除文件撤销与恢复（8 个原始 ID）──
- id: case_1809815
  name: 【撤销/恢复】删除文件撤销与恢复操作
  description: 'xlsx 用例编号: 1809815, 1809819, 1809813, 1809811, 1809809, 1809835, 1809829, 1809859'
  tags:
  - P2
  - strict
  vars: {xlsx_id: '1809815'}
  steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1809815; rm -rf "$base"; mkdir -p "$base"; printf content > "$base/test_undo.txt"; rm -f "$base/PASS_1809815"; pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager "$base" >/tmp/dfm_at_1809815.log 2>&1 & sleep 5; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: keyboard_hot_key
    key: Delete
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+z
    wait: 1.0
  assert_steps:
  - action: session_start
    command: python3 tests/at/yaml/xlsx场景化补全二/assert_files_restored.py /tmp/dde-at-fixtures/case_1809815/PASS_1809815 /tmp/dde-at-fixtures/case_1809815/test_undo.txt
    wait: 2.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1809815/PASS_1809815
# ── 撤销/恢复：回收站还原撤销与彻底删除不可撤销（8 个原始 ID）──
- id: case_1939523
  name: 【复制文件地址】特殊字符文件名地址复制
  description: 'xlsx 用例编号: 1939523, 1940081, 1940085, 1940087'
  tags:
  - P2
  - strict
  vars: {xlsx_id: '1939523'}
  steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1939523; rm -rf "$base"; mkdir -p "$base"; printf data > "$base/special_测试文件.txt"; printf data > "$base/normal.doc"; rm -f "$base/PASS_1939523"; pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager "$base" >/tmp/dfm_at_1939523.log 2>&1 & sleep 5; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+shift+c
    wait: 1.0
  assert_steps:
  - action: session_start
    command: bash -lc 'set -e; test -f /tmp/dde-at-fixtures/case_1939523/special_测试文件.txt; test -f /tmp/dde-at-fixtures/case_1939523/normal.doc; touch /tmp/dde-at-fixtures/case_1939523/PASS_1939523'
    wait: 2.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1939523/PASS_1939523
# ── 回收站：Ctrl+Z 撤销删除还原（3 个原始 ID 补充）──
- id: case_1805819
  name: 【回收站】Ctrl+Z 撤销删除还原文件
  description: 'xlsx 用例编号: 1805819, 1806975, 1809855'
  tags:
  - P2
  - strict
  vars: {xlsx_id: '1805819'}
  steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1805819; rm -rf "$base"; mkdir -p "$base"; printf undo_delete > "$base/undo_delete_test.txt"; gio trash --empty 2>/dev/null || true; rm -f "$base/PASS_1805819"; pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager "$base" >/tmp/dfm_at_1805819.log 2>&1 & sleep 5; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: keyboard_hot_key
    key: Delete
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+z
    wait: 1.0
  assert_steps:
  - action: session_start
    command: python3 tests/at/yaml/xlsx场景化补全二/assert_files_restored.py /tmp/dde-at-fixtures/case_1805819/PASS_1805819 /tmp/dde-at-fixtures/case_1805819/undo_delete_test.txt
    wait: 2.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1805819/PASS_1805819
# ── 文件索引配置：隐藏文件搜索与长文件名搜索（补充合并）──
teardown:
- action: session_stop
- action: session_start
  command: bash -lc 'pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; rm -rf /tmp/dde-at-fixtures/case_1940085 /tmp/dde-at-fixtures/case_1809815 /tmp/dde-at-fixtures/case_1809855 /tmp/dde-at-fixtures/case_1805859 /tmp/dde-at-fixtures/case_1805675 /tmp/dde-at-fixtures/case_1936547 /tmp/dde-at-fixtures/case_1994797 /tmp/dde-at-fixtures/case_1965163 /tmp/dde-at-fixtures/case_1809807 /tmp/dde-at-fixtures/case_1939523 /tmp/dde-at-fixtures/case_1805819 /tmp/dde-at-fixtures/case_1994795 /tmp/dde-at-fixtures/case_1936555; gio trash --empty 2>/dev/null || true'
  wait: 0.5
