    2. 搜索输入框键入关键字，然后按键Enter
    预期结果:
    1. 显示搜索输入框，输入框旁显示"筛选"按钮
    2. 显示匹配的搜索结果
  tags: []
  vars:
    xlsx_id: '1805497'
    case_type: 功能测试
  steps:
  - action: element_action
    ref: SearchButton
    do: click
    wait: 0.8
  - action: keyboard_type
    text: deepin
