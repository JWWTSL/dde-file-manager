name: xlsx搜索导航扩展2_suite
app: dde-file-manager
description: 从 V25 xlsx 映射的搜索输入Enter和地址栏导航扩展用例
module: xlsx搜索导航扩展2
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: dde-file-manager --open-home
  wait: 5.0
suites:
- id: case_1805535
  name: 【搜索】【支持筛选搜索】文管单击"搜索"按钮后，输入关键字进行搜索
  description: |
    xlsx 用例编号: 1805535
    前置条件: 无
    测试步骤:
    1. 打开文管，顶部工具栏，单击"搜索"按钮
    2. 搜索输入框键入关键字，然后按键Enter
    预期结果:
    1. 显示搜索输入框，输入框旁显示"筛选"按钮
    2. 显示匹配的搜索结果
  tags: []
  vars:
    xlsx_id: '1805535'
    case_type: 功能测试
  steps:
  - action: element_action
    ref: SearchButton
    do: click
    wait: 0.8
  - action: keyboard_type
    text: test
    wait: 0.5
  - action: keyboard_press
    key: enter
    wait: 2.0
  assert_steps:
  - action: assert_element
    ref: SearchButton
  - action: assert_element
    ref: AdvancedButton
- id: case_1805497
  name: 【搜索】【支持筛选搜索】文管单击搜索按钮后，输入关键字进行搜索
  description: |
