name: xlsx严格压缩补全_suite
app: dde-file-manager
description: 从 V25 xlsx 压缩与综合文件操作批次中筛选的严格文件系统结果用例，使用隔离夹具断言压缩包内容、解压结果、删除回收站元数据和文件操作结果
module: xlsx严格压缩补全
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'rm -rf /tmp/dde-at-fixtures/strict-archive "$HOME/.cache/dde-at-fixtures/strict-file-ops" && mkdir -p /tmp/dde-at-fixtures/strict-archive "$HOME/.cache/dde-at-fixtures/strict-file-ops"'
  wait: 1.0
suites:
- id: case_1850169
  name: 文件名最大长度不小于255字节
  description: 'xlsx 用例编号: 1850169

    所属模块: /V25_2500（测试部专用）/A类核心模块/文件管理器/功能要求验证(#132301)

    前置条件: 功能要求：m)文件名最大长度不小于255字节；前置条件：存在文件和文件夹名称为255字节的zip压缩包

    测试步骤:

    1. 点击打开压缩包

    2. 点击解压到本地，检查解压后的文件、文件夹名称

    预期结果:

    1. 显示压缩包文件列表

    2. 正确显示255个字节的完整名称，中间无省略号

    严格映射说明: 在 /tmp 隔离夹具内创建 255 字节文件名和 255 字节目录名，打包为 zip 后解压到本地目录。断言压缩包 listing 含完整名称，解压后同名文件和目录完整存在且内容正确。该用例验证长文件名压缩/解压核心结果，不依赖归档管理器视觉列表省略号。

    '
  tags: []
  vars:
    xlsx_id: '1850169'
    case_type: 功能测试
  steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/strict-archive/case_1850169; rm -rf "$base"; mkdir -p "$base/src" "$base/out"; file_name="$(printf "a%.0s" {1..251}).txt"; dir_name="$(printf "b%.0s" {1..255})"; test ${#file_name} -eq 255; test ${#dir_name} -eq 255; printf "long file payload" > "$base/src/$file_name"; mkdir "$base/src/$dir_name"; printf "long dir payload" > "$base/src/$dir_name/nested.txt"; (cd "$base/src" && zip -qr "$base/longnames.zip" "$file_name" "$dir_name"); unzip -Z1 "$base/longnames.zip" > "$base/listing.txt"; unzip -q "$base/longnames.zip" -d "$base/out"'
    wait: 1.0
  assert_steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/strict-archive/case_1850169; file_name="$(printf "a%.0s" {1..251}).txt"; dir_name="$(printf "b%.0s" {1..255})"; grep -Fx "$file_name" "$base/listing.txt"; grep -Fx "$dir_name/" "$base/listing.txt"; test "$(cat "$base/out/$file_name")" = "long file payload"; test "$(cat "$base/out/$dir_name/nested.txt")" = "long dir payload"; test ${#file_name} -eq 255; test ${#dir_name} -eq 255'
    wait: 0.3
teardown:
- action: session_start
  command: bash -lc 'rm -rf /tmp/dde-at-fixtures/strict-archive "$HOME/.cache/dde-at-fixtures/strict-file-ops"'
  wait: 0.3
- action: session_stop
