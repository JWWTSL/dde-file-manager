name: xlsx弱覆盖_suite
app: dde-file-manager
description: '从 V25 xlsx 筛选的弱覆盖 smoke 用例：只验证稳定入口动作和可访问元素存在'
module: xlsx弱覆盖
tags: [smoke, weak_coverage]
fast_fail: false
env_check: []
setup:
- action: session_start
  command: dde-file-manager --open-home
  wait: 5.0
suites:
- id: case_2022349
  name: 最近使用-排序
  description: '弱覆盖：进入最近使用并验证入口存在，不覆盖排序结果校验'
  tags: [weak_coverage]
  steps:
  - action: element_action
    ref: 最近使用
    do: click
    wait: 0.3
  assert_steps:
  - action: assert_element
    ref: 最近使用
