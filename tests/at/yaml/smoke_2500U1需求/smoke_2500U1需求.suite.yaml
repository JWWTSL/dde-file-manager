name: 2500U1需求_suite
app: dde-file-manager
description: 2500U1需求模块 AT-SPI 用例
module: 2500U1需求
tags: []
fast_fail: false
env_check: []
setup: []
suites:
- id: case_smoke_2500U1需求_004
  name: 【复制文件地址】复制桌面上的文件地址
  description: '来源用例编号: 1940091'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: keyboard_press
    key: ctrl+a
    wait: 1.0
  - action: element_action
    ref: 桌面
    do: click
    wait: 1.0
  - action: keyboard_press
    key: ctrl+s
    wait: 1.0
  - action: keyboard_press
    key: ctrl+shift+c
    wait: 1.0
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
  - action: assert_process_running
    app: dde-file-manager
- id: case_smoke_2500U1需求_014
  name: 【在新标签页中打开新文件夹】不勾选在新标签页中打开新文件夹
  description: '来源用例编号: 1935225'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 桌面
    do: double_click
    wait: 1.0
  - action: element_action
    ref: 桌面
    do: double_click
    wait: 1.0
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
  - action: assert_process_running
    app: dde-file-manager
teardown:
- action: session_stop
