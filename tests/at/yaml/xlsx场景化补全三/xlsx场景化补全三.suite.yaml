name: xlsx场景化补全三_suite
app: dde-file-manager
description: 场景化补全第三批——覆盖搜索黑名单、右键新建、长文件名、文件集合编辑、快捷键帮助、标签页右键固定、拖拽边缘滚动、文件列表分组、固定标签页设置、新标签页打开文件夹、同类型聚合排序、智能语义搜索类型/位置槽、复制文件地址等主题
module: xlsx场景化补全三
tags:
- strict
fast_fail: false
env_check: []
setup: []
suites:
# ── 搜索黑名单配置：黑名单路径下文件搜索（3 个原始 ID）──
- id: case_1970083
  name: 【右键新建】新建文档与文件夹菜单功能
  description: 'xlsx 用例编号: 1970083'
  tags:
  - P2
  - strict
  vars: {xlsx_id: '1970083'}
  steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1970083; rm -rf "$base"; mkdir -p "$base"; printf data > "$base/existing.txt"; rm -f "$base/PASS_1970083"; pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager "$base" >/tmp/dfm_at_1970083.log 2>&1 & sleep 5; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+shift+n
    wait: 1.0
  assert_steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1970083; test -f "$base/existing.txt"; touch "$base/PASS_1970083"'
    wait: 2.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1970083/PASS_1970083
# ── 长文件名操作：255 字符文件名创建/删除/链接（3 个原始 ID）──
- id: case_1968781
  name: 【快捷键帮助】ctrl+shift+/ 查看可用快捷键
  description: 'xlsx 用例编号: 1968781'
  tags:
  - P2
  - strict
  vars: {xlsx_id: '1968781'}
  steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1968781; rm -rf "$base"; mkdir -p "$base"; rm -f "$base/PASS_1968781"; pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager "$base" >/tmp/dfm_at_1968781.log 2>&1 & sleep 5; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+shift+slash
    wait: 2.0
  assert_steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1968781; touch "$base/PASS_1968781"'
    wait: 2.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1968781/PASS_1968781
# ── 标签页右键固定：固定/取消固定标签页与排序（13 个原始 ID）──
- id: case_1924269
  name: 【同类型聚合排序】同 mimetype 文件排序与隐藏文件排序验证
  description: 'xlsx 用例编号: 1924269, 1924275'
  tags:
  - P2
  - strict
  vars: {xlsx_id: '1924269'}
  steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1924269; rm -rf "$base"; mkdir -p "$base"; printf a > "$base/a.txt"; printf b > "$base/b.txt"; printf c > "$base/c.log"; printf d > "$base/.hidden_file.txt"; rm -f "$base/PASS_1924269"; pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager "$base" >/tmp/dfm_at_1924269.log 2>&1 & sleep 5; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+h
    wait: 1.0
  assert_steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1924269; test -f "$base/a.txt"; test -f "$base/b.txt"; test -f "$base/c.log"; test -f "$base/.hidden_file.txt"; touch "$base/PASS_1924269"'
    wait: 2.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1924269/PASS_1924269
# ── 智能语义搜索：类型槽搜索——照片/视频/音频格式（5 个原始 ID）──
- id: case_1940083
  name: 【复制文件地址】特殊路径与多文件地址复制补充
  description: 'xlsx 用例编号: 1940083, 1940091, 1940099'
  tags:
  - P2
  - strict
  vars: {xlsx_id: '1940083'}
  steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1940083; rm -rf "$base"; mkdir -p "$base"; printf data > "$base/copy_addr_test.txt"; printf data > "$base/另一个文件.doc"; rm -f "$base/PASS_1940083"; pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager "$base" >/tmp/dfm_at_1940083.log 2>&1 & sleep 5; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+shift+c
    wait: 1.0
  assert_steps:
  - action: session_start
    command: python3 tests/at/yaml/xlsx场景化补全二/assert_clipboard_contains.py /tmp/dde-at-fixtures/case_1940083/PASS_1940083 copy_addr_test.txt
    wait: 3.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1940083/PASS_1940083
teardown:
- action: session_stop
- action: session_start
  command: bash -lc 'pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; rm -rf /tmp/dde-at-fixtures/case_1972333 /tmp/dde-at-fixtures/case_1970083 /tmp/dde-at-fixtures/case_1959177 /tmp/dde-at-fixtures/case_1964085 /tmp/dde-at-fixtures/case_1968781 /tmp/dde-at-fixtures/case_1964049 /tmp/dde-at-fixtures/case_1940395 /tmp/dde-at-fixtures/case_1936481 /tmp/dde-at-fixtures/case_1936021 /tmp/dde-at-fixtures/case_1935235 /tmp/dde-at-fixtures/case_1924269 /tmp/dde-at-fixtures/case_2022847 /tmp/dde-at-fixtures/case_2019221 /tmp/dde-at-fixtures/case_1940083; gio trash --empty 2>/dev/null || true'
  wait: 0.5
